name: Python Publish

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 🚨 为 setuptools_scm 获取完整 tag 历史

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Check README/docs sync
        run: |
          python scripts/sync_readme_to_docs.py --check

      - name: Run tests with coverage
        run: |
          MPLBACKEND=Agg python -m pytest --cov=pysmatch --cov-report xml --cov-report term

      - name: Build and smoke-test wheel
        if: matrix.python-version == '3.11'
        run: |
          python -m build
          twine check dist/*
          python -m pip install --target "$RUNNER_TEMP/pysmatch-wheel" --no-deps dist/*.whl
          PYTHONPATH="$RUNNER_TEMP/pysmatch-wheel" python - <<'PY'
          from pysmatch import load_demo
          assert load_demo().shape == (500, 9)
          print("wheel smoke test passed")
          PY

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          name: codecov-coverage
          fail_ci_if_error: false

  build-and-publish:
    name: Build and publish to PyPI and create GitHub release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-and-test ]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 🚨 否则 setuptools_scm 无法识别版本

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel build twine setuptools-scm

      - name: Validate tag/version alignment
        run: |
          PACKAGE_VERSION=$(python -m setuptools_scm)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "Tag version: ${TAG_VERSION}"
          echo "Computed package version: ${PACKAGE_VERSION}"
          if [ "${PACKAGE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "Version mismatch: tag and package version are not aligned."
            exit 1
          fi

      - name: Build package using PEP 517
        run: |
          python -m build

      - name: Check package metadata
        run: |
          twine check dist/*

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          repository_url: https://upload.pypi.org/legacy/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
